<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Strength Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🔐 Password Strength Checker</h1>

        <p>Enter a password to check its strength.</p>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

       <div id="strength"></div>
        
<div class="strength-bar">
    <div id="strength-fill"></div>
</div>
        
<p id="message"></p>

<div class="requirements">
    <h3>Password Requirements</h3>

    <p id="length">❌ At least 8 characters</p>
    <p id="uppercase">❌ Contains an uppercase letter</p>
    <p id="lowercase">❌ Contains a lowercase letter</p>
    <p id="number">❌ Contains a number</p>
    <p id="special">❌ Contains a special character</p>
</div>

    <script src="script.js"></script>

</body>
</html>
